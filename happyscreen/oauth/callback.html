<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>HappyScreen</title>
<style>
  body { font-family: system-ui, sans-serif; background:#1B1530; color:#fff; display:flex; min-height:100vh;
         align-items:center; justify-content:center; margin:0; padding:16px; text-align:center; }
  .box { max-width: 420px; }
  a { color:#FFC857; }
</style>
</head>
<body>
<div class="box">
  <h1>HappyScreen</h1>
  <p id="msg"></p>
</div>
<script>
// Esta página só repassa a resposta do Google para a TV na rede local.
// Ela não guarda nada e não envia nada para nenhum outro servidor.
// O "code" sozinho é inútil: a TV precisa do code_verifier (PKCE), que nunca sai dela.
(function () {
  // Spec 009: mensagens nos 5 idiomas do app, pelo idioma do navegador (padrão: inglês).
  var T = {
    pt: ['Enviando a autorização para a sua TV…', 'Não foi possível identificar a TV. Volte para a TV e tente de novo.'],
    en: ['Sending the authorization to your TV…', 'Could not identify the TV. Go back to the TV and try again.'],
    es: ['Enviando la autorización a tu TV…', 'No se pudo identificar la TV. Vuelve a la TV e inténtalo de nuevo.'],
    ja: ['テレビに認可を送信しています…', 'テレビを特定できませんでした。テレビに戻って、もう一度お試しください。'],
    zh: ['正在將授權傳送到你的電視…', '無法識別電視。請回到電視再試一次。']
  };
  var lang = (navigator.language || 'en').toLowerCase();
  var key = lang.slice(0, 2);
  if (key === 'zh' && !/hant|tw|hk|mo/.test(lang)) key = 'en';
  var t = T[key] || T.en;
  var msg = document.getElementById('msg');
  msg.textContent = t[0];
  var p = new URLSearchParams(location.search);
  var state = p.get('state') || '';
  var dot = state.indexOf('.');
  var addr = '';
  try {
    addr = atob(state.slice(0, dot).replace(/-/g, '+').replace(/_/g, '/'));
  } catch (e) { addr = ''; }
  // Aceita só endereços de rede local no formato IP:porta.
  var ok = /^(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}):\d{2,5}$/.test(addr);
  if (dot < 1 || !ok) {
    msg.textContent = t[1];
    return;
  }
  var q = new URLSearchParams();
  ['code', 'state', 'error'].forEach(function (k) { if (p.get(k)) q.set(k, p.get(k)); });
  history.replaceState(null, '', location.pathname); // tira o code da barra de endereço/histórico
  location.replace('http://' + addr + '/callback?' + q.toString());
})();
</script>
</body>
</html>
